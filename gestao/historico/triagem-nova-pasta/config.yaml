name: Main Config
version: 1.0.0
schema: v1
models:
  # ── Principal: Gemini (nuvem, mais rápido e mais preciso) ──
  - name: Gemini 3.8 Flash
    provider: gemini
    model: gemini-3.8-flash
    apiKey: ${{ secrets.GEMINI_API_KEY }}
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 1048576
      maxTokens: 65536
    capabilities:
      - tool_use
      - image_input

  - name: Gemini 3.1 Flash-Lite (mais barato, bom para tarefas simples)
    provider: gemini
    model: gemini-3.1-flash-lite
    apiKey: ${{ secrets.GEMINI_API_KEY }}
    roles:
      - chat
      - edit
      - apply

  # ── Fallback: Ollama local (sem limite, sem internet, mais lento) ──
  - name: Qwen 2.5 Coder 7B (local, sem limite)
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - autocomplete

  - name: DeepSeek Coder V2 Lite (local, alternativa)
    provider: ollama
    model: deepseek-coder-v2:16b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
