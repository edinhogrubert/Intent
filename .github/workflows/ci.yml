name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/mvp-backend-base
      - chore/auditoria-gestao-v1-20260918

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Verificar TypeScript
        run: bun run lint

      - name: Gerar build
        run: bun run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: intent_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Preparar Bun para testes que importam componentes do frontend
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Instalar dependências do frontend para testes cruzados
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Verificar TypeScript
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Testar idempotência em PostgreSQL real
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/intent_test_ci
        run: npm run test:postgres

      - name: Gerar build
        run: npm run build

  deployment-scripts:
    name: Scripts Oracle
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Validar sintaxe Bash
        run: bash -n deploy/oracle/*.sh

      - name: Validar sintaxe e interface dos executores PC e VM
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/executores/intent-executor-PC.sh scripts/executores/intent-executor-VM.sh; do
            bash -n "$script"
            for id in $(seq 1 15); do
              grep -Eq "^task_${id}\\(\\)\\{" "$script" || { echo "Função $id ausente em $script"; exit 1; }
            done
          done

      - name: Validar destinos da continuidade após reorganização
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            gestao/governanca/contratos/README.md \
            gestao/governanca/contratos/INTERFACE_EXECUTORES.md \
            gestao/governanca/contratos/ARQUITETURA_ATUAL_VM.md \
            gestao/comunicacao/ai-handoff/continuidade/ESTADO_ATUAL_INTENT.md \
            gestao/comunicacao/ai-handoff/continuidade/PROMPT_RETOMADA_CHATGPT.md; do
            test -f "$path" || { echo "Documento ausente: $path"; exit 1; }
          done
          if grep -En 'local files=\((contratos/|docs/ai-handoff/)' scripts/executores/intent-executor-PC.sh scripts/executores/intent-executor-VM.sh; then
            echo 'Função 9 ainda aponta para caminhos anteriores à reorganização.'
            exit 1
          fi
